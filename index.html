<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu geral</title>
<meta name="description" content="Menu geral: painéis gerenciais, jogos e apps.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  /* ---------- Fundo: troque aqui quando a imagem chegar (ver README) ---------- */
  :root {
    --fundo: url("assets/fundo.webp");  /* imagem de fundo; troque por "none" para voltar ao marfim liso */
    --veu: rgba(246, 243, 238, .3);   /* véu marfim por cima da imagem; aumente o último número para clarear */
    --base: #f6f3ee;                  /* marfim */
    --texto: #24272e;                 /* grafite */
    --texto-suave: #6b6f78;
    --linha-fina: #e2ddd5;
    --ouro: #b0904f;
  }
  /* ---------- Cor de cada família ---------- */
  .vinho { --cor: #6e1420; }
  .azul  { --cor: #23346b; }
  .verde { --cor: #1f5244; }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--texto);
    background: var(--base);
    display: flex;
    flex-direction: column;
  }
  /* Fundo fixo em camada própria (background-attachment: fixed falha no iOS) */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(var(--veu), var(--veu)), var(--fundo) center / cover no-repeat, var(--base);
  }
  .voltar {
    position: absolute; top: 16px; left: 16px;
    display: inline-flex; align-items: center; min-height: 44px; padding: 8px 16px;
    font-weight: 600; font-size: 15px; text-decoration: none; color: var(--texto);
    background: #fff; border: 1px solid var(--linha-fina); border-radius: 8px;
  }
  .voltar:hover { border-color: var(--texto); }
  header { text-align: center; padding: 48px 16px 12px; }
  .simbolo { display: block; width: 84px; height: 84px; margin: 0 auto 18px; }
  .marca { display: block; width: min(330px, 78vw); height: auto; margin: 0 auto; }
  .oculto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .sobretitulo {
    margin: 0 0 6px; font-size: 13px; font-weight: 700; letter-spacing: .16em;
    text-transform: uppercase; color: var(--texto-suave);
  }
  h1 { margin: 0; font-size: clamp(27px, 4.6vw, 40px); font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
  .chamada { margin: 8px auto 0; max-width: 34em; font-size: 17px; color: var(--texto-suave); text-wrap: pretty; }
  main { flex: 1; padding: 26px 16px 48px; }
  .grade {
    list-style: none; margin: 0 auto; padding: 0; max-width: 1180px;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 16px 20px;
  }
  .grade li { width: min(372px, 100%); display: flex; }

  /* ---------- Botão: cartão branco com um bloco de cor (como os blocos da marca) ---------- */
  .botao {
    position: relative; flex: 1;
    display: flex; align-items: center; gap: 16px;
    min-height: 92px; padding: 12px 18px 12px 12px;
    background: #fff; border: 1px solid var(--linha-fina); border-radius: 12px;
    color: var(--texto); text-decoration: none;
    box-shadow: 0 1px 2px rgba(36, 39, 46, .05);
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  a.botao:hover { transform: translateY(-2px); border-color: var(--cor); box-shadow: 0 8px 18px rgba(36, 39, 46, .12); }
  a.botao:active { transform: translateY(0); }
  .botao:focus-visible, .voltar:focus-visible { outline: 3px solid var(--ouro); outline-offset: 3px; }
  .icone {
    flex: none; display: grid; place-items: center;
    width: 68px; height: 68px; border-radius: 8px;
    background: var(--cor); color: #fff;
  }
  .icone svg { width: 38px; height: 38px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .icone .cheio { fill: currentColor; stroke: none; }
  .rotulo { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .linha { font-size: 13.5px; font-weight: 600; letter-spacing: .01em; color: var(--cor); }
  .nome { font-size: 21px; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; text-wrap: balance; }
  /* ---------- Em breve: sem clique, apagado, com selo ---------- */
  .breve { background: rgba(255, 255, 255, .84); border-style: dashed; box-shadow: none; cursor: default; }
  .breve .icone { background: #b3aea6; }
  .breve .linha, .breve .nome { color: var(--texto-suave); }
  .selo {
    position: absolute; top: 9px; right: 10px;
    padding: 2px 8px; border: 1px solid #cdc7be; border-radius: 999px; background: #fff;
    font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--texto-suave);
  }
  footer { text-align: center; font-size: 13px; padding: 0 16px 20px; color: var(--texto-suave); }

  /* ---------- Capa: três portas grandes ---------- */
  .grade { gap: 22px; }
  .grade li { width: min(352px, 100%); }
  .botao.porta { flex-direction: column; align-items: stretch; gap: 0; padding: 0; overflow: hidden; min-height: 0; }
  .porta .topo { display: grid; place-items: center; height: 150px; background: var(--cor); }
  .porta .topo svg { width: 78px; height: 78px; }
  .porta .rotulo { padding: 18px 20px 20px; gap: 6px; flex: 1; }
  .porta .nome { font-size: 24px; }
  .porta .linha { font-size: 15.5px; font-weight: 400; line-height: 1.4; color: var(--texto-suave); text-wrap: pretty; }
  .porta .abrir { margin-top: auto; padding-top: 10px; font-size: 14.5px; font-weight: 700; color: var(--cor); }

  @media (max-width: 560px) {
    header { padding-top: 36px; }
    .simbolo { width: 68px; height: 68px; margin-bottom: 14px; }
    .grade { gap: 10px; }
    .botao { min-height: 84px; }
    .icone { width: 60px; height: 60px; }
    .icone svg { width: 34px; height: 34px; }
    .nome { font-size: 19.5px; }
    .botao.porta { flex-direction: row; }
    .porta .topo { width: 104px; height: auto; flex: none; }
    .porta .topo svg { width: 56px; height: 56px; }
    .porta .rotulo { padding: 14px 16px; }
    .porta .nome { font-size: 20px; }
    .porta .linha { font-size: 14.5px; }
    .porta .abrir { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .botao { transition: none; } }
</style>
</head>
<body>
<header>
  <svg class="simbolo" viewBox="0 0 96 96" aria-hidden="true"><rect fill="#6e1420" x="2" y="2" width="52" height="52" rx="3.5"/><rect fill="#23346b" x="59.5" y="2" width="34.5" height="52" rx="3.5"/><rect fill="#b0904f" x="2" y="59.5" width="34.5" height="34.5" rx="3.5"/><rect fill="#1f5244" x="42" y="59.5" width="52" height="34.5" rx="3.5"/></svg>
  <p class="sobretitulo">Menu geral</p>
  <h1 id="frase">Qual porta vamos abrir hoje?</h1>
</header>
<main>
  <nav aria-label="Menus">
    <ul class="grade">
      <li><a class="botao porta vinho" href="../menu/"><span class="topo"><svg viewBox="0 0 96 96" aria-hidden="true"><g fill="#ffffff"><rect x="2" y="62" width="27" height="32" rx="3"/><rect x="34.5" y="38" width="27" height="56" rx="3"/><rect x="67" y="2" width="27" height="92" rx="3"/></g><rect fill="#ffffff" fill-opacity=".45" x="2" y="2" width="27" height="54.5" rx="3"/><rect fill="#b0904f" x="34.5" y="2" width="27" height="30.5" rx="3"/></svg></span><span class="rotulo"><span class="nome">Painéis Gerenciais</span><span class="linha">Projetos, processos, riscos e pessoas na gestão pública.</span><span class="abrir" aria-hidden="true">Abrir →</span></span></a></li>
      <li><a class="botao porta azul" href="../jogos/"><span class="topo"><svg viewBox="0 0 96 96" aria-hidden="true"><rect x="2" y="2" width="92" height="92" rx="20" fill="#ffffff"/><g transform="translate(48 49) scale(.74) translate(-48 -50)"><path d="M48 10L82.6 30 48 50 13.4 30z" fill="#b0904f" fill-opacity=".3"/><path d="M13.4 30L48 50v40L13.4 70z" fill="#23346b" fill-opacity=".12"/><path d="M48 10L82.6 30v40L48 90 13.4 70V30zM13.4 30L48 50l34.6-20M48 50v40" fill="none" stroke="#23346b" stroke-width="3.4" stroke-linejoin="round"/><g fill="#23346b"><ellipse cx="48" cy="30" rx="6" ry="3.6"/><circle cx="24.9" cy="50" r="3.6"/><circle cx="36.5" cy="70" r="3.6"/><circle cx="56.7" cy="55" r="3.6"/><circle cx="65.3" cy="60" r="3.6"/><circle cx="74" cy="65" r="3.6"/></g><g fill="#b0904f"><circle cx="48" cy="10" r="4.6"/><circle cx="82.6" cy="30" r="4.6"/><circle cx="82.6" cy="70" r="4.6"/><circle cx="48" cy="90" r="4.6"/><circle cx="13.4" cy="70" r="4.6"/><circle cx="13.4" cy="30" r="4.6"/><circle cx="48" cy="50" r="5"/></g></g></svg></span><span class="rotulo"><span class="nome">Jogar e aprender</span><span class="linha">Jogos e modelos de ciência para abrir no navegador.</span><span class="abrir" aria-hidden="true">Abrir →</span></span></a></li>
      <li><a class="botao porta verde" href="../apps/"><span class="topo"><svg viewBox="0 0 96 96" aria-hidden="true"><g fill="#ffffff"><rect x="2" y="2" width="43.25" height="43.25" rx="4"/><rect x="2" y="50.75" width="43.25" height="43.25" rx="4"/></g><rect fill="#ffffff" fill-opacity=".45" x="50.75" y="2" width="43.25" height="43.25" rx="4"/><rect fill="#b0904f" x="50.75" y="50.75" width="43.25" height="43.25" rx="4"/><path d="M62 73l7.5 7.5L83 65" fill="none" stroke="#1f5244" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="rotulo"><span class="nome">Apps do dia a dia</span><span class="linha">Receitas, finanças, treinos e outras ajudas.</span><span class="abrir" aria-hidden="true">Abrir →</span></span></a></li>
    </ul>
  </nav>
</main>
<footer>Menu geral</footer>
<script>
  // Sorteia uma das frases a cada acesso. Sem JavaScript, fica a primeira.
  var frases = [
    "Qual porta vamos abrir hoje?",
    "Trabalhar, jogar ou resolver a vida?",
    "Hoje é dia de quê?",
    "Escolha a sua aventura de hoje"
  ];
  document.getElementById("frase").textContent = frases[Math.floor(Math.random() * frases.length)];
</script>
</body>
</html>
