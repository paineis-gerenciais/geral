<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu geral</title>
<meta name="description" content="Menu geral: painéis gerenciais, jogos e apps.">
<link rel="icon" href="data:,">
<style>
  /* ---------- Arte: troque aqui quando as imagens chegarem (ver README) ---------- */
  :root {
    --fundo: none;                 /* depois: url("assets/fundo.webp") */
    --veu: rgba(255, 255, 255, .62); /* véu claro por cima da imagem de fundo */
    --base: #f6f2ec;              /* cor do fundo enquanto não há imagem */
    --mancha-1: rgba(164, 20, 20, .10);
    --mancha-2: rgba(18, 130, 95, .12);
    --texto: #2b2530;
    --texto-suave: #5d5563;
    --ouro-claro: #f6dc9a;
    --ouro: #d4a24c;
    --ouro-escuro: #8a5f14;
  }
  /* ---------- Cores de cada família de botão ---------- */
  .vinho { --escuro: #4f0505; --medio: #a41414; --sombra: rgba(139, 10, 10, .32); }
  .azul  { --escuro: #111a55; --medio: #2f45b8; --sombra: rgba(32, 48, 150, .32); }
  .verde { --escuro: #073f31; --medio: #12825f; --sombra: rgba(10, 100, 72, .32); }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--texto);
    background: var(--base);
    display: flex;
    flex-direction: column;
  }
  /* Fundo fixo em camada própria (background-attachment: fixed falha no iOS) */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      linear-gradient(var(--veu), var(--veu)),
      var(--fundo) center / cover no-repeat,
      radial-gradient(60% 55% at 12% 8%, var(--mancha-1), transparent 70%),
      radial-gradient(55% 60% at 92% 96%, var(--mancha-2), transparent 70%),
      var(--base);
  }
  .voltar {
    position: absolute; top: 16px; left: 16px;
    display: inline-flex; align-items: center; min-height: 44px; padding: 8px 18px;
    font-weight: 600; font-size: 15px; text-decoration: none; color: var(--texto);
    background: rgba(255, 255, 255, .78);
    border: 2px solid var(--ouro); border-radius: 999px;
  }
  .voltar:hover { background: #fff; }
  header { text-align: center; padding: 44px 16px 10px; }
  .simbolo { display: block; width: 132px; height: 132px; margin: 0 auto 10px; object-fit: contain; }
  .sobretitulo {
    margin: 0 0 4px; font-size: 14px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ouro-escuro);
  }
  h1 { margin: 0; font-size: clamp(28px, 5vw, 44px); font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
  .chamada { margin: 8px auto 0; max-width: 34em; font-size: 17px; color: var(--texto-suave); text-wrap: pretty; }
  main { flex: 1; padding: 22px 16px 44px; }
  .grade {
    list-style: none; margin: 0 auto; padding: 0; max-width: 1180px;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 18px 22px;
  }
  .grade li { width: min(372px, 100%); }

  /* ---------- Botão (mesma anatomia dos botões dos Painéis: ícone | traço | nome) ---------- */
  .botao {
    position: relative; overflow: hidden;
    display: flex; align-items: center; gap: 16px;
    min-height: 112px; padding: 16px 22px 16px 16px;
    border: 2px solid transparent; border-radius: 20px;
    color: #fff; text-decoration: none;
    background:
      linear-gradient(135deg, var(--escuro) 0%, var(--medio) 46%, var(--escuro) 100%) padding-box,
      linear-gradient(135deg, var(--ouro-claro), #a87722 45%, var(--ouro-claro) 100%) border-box;
    box-shadow: 0 8px 18px var(--sombra), inset 0 1px 0 rgba(255, 255, 255, .28);
    transition: transform .18s ease, filter .18s ease;
  }
  /* Brilho no alto e arco dourado no canto, como na arte dos Painéis */
  .botao::before {
    content: ""; position: absolute; inset: 0 0 52% 0;
    background: linear-gradient(rgba(255, 255, 255, .16), rgba(255, 255, 255, 0));
    pointer-events: none;
  }
  .botao::after {
    content: ""; position: absolute; right: -150px; bottom: -262px;
    width: 300px; height: 300px; border-radius: 50%;
    border: 3px solid rgba(246, 220, 154, .7);
    box-shadow: 0 0 16px rgba(246, 220, 154, .4);
    pointer-events: none;
  }
  a.botao:hover { transform: translateY(-3px) scale(1.02); filter: brightness(1.1); }
  a.botao:active { transform: translateY(0) scale(.99); }
  .botao:focus-visible, .voltar:focus-visible { outline: 3px solid var(--texto); outline-offset: 3px; }
  .icone {
    flex: none; display: grid; place-items: center;
    width: 76px; height: 76px; border-radius: 14px;
    border: 1.5px solid rgba(246, 220, 154, .85);
    background: rgba(0, 0, 0, .24);
    color: var(--ouro-claro);
  }
  .icone svg { width: 46px; height: 46px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .icone .cheio { fill: currentColor; stroke: none; }
  .traco { flex: none; align-self: stretch; width: 1.5px; margin: 6px 0; background: linear-gradient(transparent, var(--ouro-claro), transparent); }
  .rotulo { position: relative; z-index: 1; display: flex; flex-direction: column; min-width: 0; line-height: 1.12; }
  .linha { font-size: 16px; font-weight: 600; color: rgba(255, 255, 255, .95); }
  .nome {
    font-size: 29px; font-weight: 800; letter-spacing: -.01em; color: var(--ouro-claro);
    text-shadow: 0 2px 3px rgba(0, 0, 0, .35);
  }
  .nome.longo { font-size: 24px; }
  /* ---------- Em breve: botão sem clique, em cor apagada, com selo ---------- */
  .azul.breve  { --escuro: #2b3050; --medio: #5a628f; --sombra: rgba(60, 66, 110, .2); }
  .verde.breve { --escuro: #243d36; --medio: #55857a; --sombra: rgba(50, 90, 78, .2); }
  .breve { cursor: default; }
  .breve .icone, .breve .nome { opacity: .82; }
  .selo {
    position: absolute; top: 9px; right: 11px; z-index: 2;
    padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    color: #3a2a05; background: linear-gradient(135deg, var(--ouro-claro), var(--ouro));
    box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
  }
  footer { text-align: center; font-size: 13px; padding: 0 16px 20px; color: var(--texto-suave); }

  /* ---------- Capa: três portas grandes ---------- */
  .grade { gap: 24px; }
  .grade li { width: min(352px, 100%); display: flex; }
  .botao.porta {
    flex: 1; flex-direction: column; align-items: flex-start; gap: 14px;
    min-height: 268px; padding: 26px 26px 24px;
  }
  .botao.porta::after { right: -170px; bottom: -236px; }
  .porta .icone { width: 92px; height: 92px; border-radius: 18px; }
  .porta .icone svg { width: 56px; height: 56px; }
  .porta .nome { font-size: 31px; }
  .porta .linha { margin-top: 8px; font-size: 16.5px; font-weight: 500; line-height: 1.35; text-wrap: pretty; }
  .porta .abrir {
    position: relative; z-index: 1; margin-top: auto;
    font-size: 15px; font-weight: 700; color: var(--ouro-claro);
  }

  @media (max-width: 560px) {
    header { padding-top: 32px; }
    .simbolo { width: 104px; height: 104px; }
    .grade { gap: 12px; }
    .botao.porta { min-height: 0; flex-direction: row; align-items: center; padding: 16px 20px 16px 16px; }
    .botao.porta::after { right: -150px; bottom: -262px; }
    .porta .icone { width: 64px; height: 64px; border-radius: 14px; }
    .porta .icone svg { width: 38px; height: 38px; }
    .porta .nome { font-size: 24px; }
    .porta .linha { margin-top: 4px; font-size: 14.5px; }
    .porta .abrir { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .botao { transition: none; } }
</style>
</head>
<body>
<header>
  <!-- Símbolo provisório em código. Com a arte pronta, troque este <svg> por:
       <img class="simbolo" src="assets/simbolo.webp" width="512" height="512" alt=""> -->
  <svg class="simbolo" viewBox="0 0 120 120" aria-hidden="true">
    <defs><linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dc9a"/><stop offset=".5" stop-color="#a87722"/><stop offset="1" stop-color="#f6dc9a"/></linearGradient></defs>
    <path d="M60 8l44 16v34c0 28-19 46-44 54C35 104 16 86 16 58V24z" fill="#fff" stroke="url(#ouro)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M60 17v43L24 47V29.5z" fill="#a41414"/>
    <path d="M60 17l36 12.5V47L60 60z" fill="#2f45b8"/>
    <path d="M24 56l36 13 36-13v2c0 23-15 38-36 45-21-7-36-22-36-45z" fill="#12825f"/>
  </svg>
  <p class="sobretitulo">Menu geral</p>
  <h1 id="frase">Qual porta vamos abrir hoje?</h1>
</header>
<main>
  <nav aria-label="Menus">
    <ul class="grade">
      <li><a class="botao porta vinho" href="../menu/"><span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M7.5 20v-5M12 20V9M16.5 20v-8"/><path d="M5 9.5l4.5-3.5 3 2L18.5 4M15.5 4h3v3"/></svg></span><span class="rotulo"><span class="nome">Painéis Gerenciais</span><span class="linha">Projetos, processos, riscos e pessoas na gestão pública.</span></span><span class="abrir" aria-hidden="true">Abrir →</span></a></li>
      <li><a class="botao porta azul" href="../jogos/"><span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3.6"/><circle class="cheio" cx="8.6" cy="8.6" r="1.25"/><circle class="cheio" cx="12" cy="12" r="1.25"/><circle class="cheio" cx="15.4" cy="15.4" r="1.25"/><circle class="cheio" cx="15.4" cy="8.6" r="1.25"/><circle class="cheio" cx="8.6" cy="15.4" r="1.25"/></svg></span><span class="rotulo"><span class="nome">Jogar e aprender</span><span class="linha">Jogos e modelos de ciência para abrir no navegador.</span></span><span class="abrir" aria-hidden="true">Abrir →</span></a></li>
      <li><a class="botao porta verde" href="../apps/"><span class="icone"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.8"/><rect x="13" y="4" width="7" height="7" rx="1.8"/><rect x="4" y="13" width="7" height="7" rx="1.8"/><path d="M14.2 16.6l1.7 1.7 3.2-3.4"/></svg></span><span class="rotulo"><span class="nome">Apps do dia a dia</span><span class="linha">Receitas, finanças, treinos e outras ajudas.</span></span><span class="abrir" aria-hidden="true">Abrir →</span></a></li>
    </ul>
  </nav>
</main>
<footer>Menu geral</footer>
<script>
  // Sorteia uma das frases a cada acesso. Sem JavaScript, fica a primeira.
  var frases = [
    "Qual porta vamos abrir hoje?",
    "Trabalhar, jogar ou resolver a vida?",
    "Hoje é dia de quê?",
    "Escolha a sua aventura de hoje"
  ];
  document.getElementById("frase").textContent = frases[Math.floor(Math.random() * frases.length)];
</script>
</body>
</html>
